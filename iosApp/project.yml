# Generate the Xcode project with `xcodegen generate` (see README). The Kotlin framework must be built first:
#   ./gradlew :shared:assembleSharedReleaseXCFramework
name: Eyecad
options:
  bundleIdPrefix: com.eyecad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Eyecad:
    type: application
    platform: iOS
    sources:
      - path: Eyecad
        excludes:
          - "**/.gitkeep"
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: true
      - sdk: ARKit.framework
      - sdk: RoomPlan.framework
      - sdk: Vision.framework
    info:
      path: Eyecad/Info.plist
      properties:
        CFBundleDisplayName: Eyecad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSCameraUsageDescription: Eyecad uses the camera to map the room.
        NSLocationWhenInUseUsageDescription: Eyecad uses your location to place the map on the globe.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eyecad.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
schemes:
  Eyecad:
    build:
      targets:
        Eyecad: all
    archive:
      config: Release
